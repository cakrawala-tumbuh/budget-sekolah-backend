# CI HANYA memanggil `make test` — gate yang persis sama dengan lokal.
# Logika lint + unit ada di Makefile + Dockerfile.test, tidak diduplikasi
# di sini, sehingga lokal dan CI dijamin identik.
name: Automated Test

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Automated test (lint + unit) di Docker
        run: make test
