name: Unit Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: pytest via Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Build Docker image (stage test)
        run: docker build --target test -t budget-backend-ypii:test .

      - name: Jalankan semua unit test
        run: docker run --rm budget-backend-ypii:test
